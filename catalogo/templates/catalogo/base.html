<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Ferretería El engranaje{% endblock %}</title>
    <!-- Bootstrap CSS para mejora visual libre -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'lista_productos' %}">🔧 Ferretería "El Tornillo" - Catálogo Online</a>
            
            <!-- Opciones de sesión -->
            <div>
                {% if user.is_authenticated %}
                    <span class="text-light me-3 small">👤 Hola, <strong>{{ user.username }}</strong></span>
                    
                    {% if user.is_staff %}
                        <!-- Botón exclusivo para el administrador -->
                        <a href="{% url 'gestionar_productos' %}" class="btn btn-warning btn-sm me-2">⚙️ Gestionar Inventario</a>
                    {% endif %}
                    
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">🔑 Iniciar Sesión</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block contenido %}
        {% endblock %}
    </main>

    <footer class="text-center py-4 text-muted border-top">
        <p>&copy; 2026 - Proyecto Transversal INACAP</p>
    </footer>
</body>
</html>
